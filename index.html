<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人名片</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 页面主体 -->
    <main class="page">
      <!-- 名片容器 -->
      <section class="card" aria-label="个人名片">
        <!-- 头像区域 -->
        <div class="avatar-wrap">
          <img
            src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80"
            alt="个人头像"
          />
        </div>

        <!-- 个人信息 -->
        <div class="info">
          <h1>邹晓雨</h1>
          <p class="title">UI / UX 设计师</p>
          <div class="divider"></div>

          <ul class="contact-list">
            <li>
              <span>电话</span>
              <a href="tel:+8613800000000">+86 138 0000 0000</a>
            </li>
            <li>
              <span>邮箱</span>
              <a href="mailto:hello@xiaoyu.design">hello@xiaoyu.design</a>
            </li>
            <li>
              <span>网站</span>
              <a href="https://www.xiaoyu.design" target="_blank" rel="noreferrer">www.xiaoyu.design</a>
            </li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
